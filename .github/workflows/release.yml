name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  release:
    name: 发布 Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "version=v${VERSION}" >> $GITHUB_OUTPUT
            echo "version_number=${VERSION}" >> $GITHUB_OUTPUT
          else
            VERSION="${{ github.ref_name }}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "version_number=${VERSION#v}" >> $GITHUB_OUTPUT
          fi

      - name: Create or update tag (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Update pom.xml version
        run: mvn versions:set -DnewVersion=${{ steps.version.outputs.version_number }} -B

      - name: Build with Maven
        run: mvn clean package -B

      - name: Publish to GitHub Packages
        run: mvn deploy -DskipTests -B
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: |
            target/database-connect-*.jar
          body: |
            ## DatabaseConnect ${{ steps.version.outputs.version }}

            数据库连接与操作模块

            ### 📦 安装方法

            **Maven:**
            ```xml
            <dependency>
                <groupId>org.bigdata</groupId>
                <artifactId>database-connect</artifactId>
                <version>${{ steps.version.outputs.version_number }}</version>
            </dependency>
            ```

            配置 GitHub Packages 仓库：
            ```xml
            <repositories>
                <repository>
                    <id>github</id>
                    <url>https://maven.pkg.github.com/BigData2026QDU/DatabaseConnectModule</url>
                </repository>
            </repositories>
            ```

            **或直接下载 JAR 文件添加到项目中。**

            ### 📄 更新内容

            详见 [Commits](${{ github.event.repository.html_url }}/commits/main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
